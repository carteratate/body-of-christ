[project]
name = "theocorpus-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic-settings>=2.2.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "PyJWT[cryptography]>=2.8.0",
    "cryptography>=42.0.0",
    "anthropic==1.2.0",
    "openai>=2.41.1",
    "qdrant-client>=1.9.0",
    "cohere>=5.0.0",
    "aiohttp>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx2>=2.13",  # imported directly by tests/test_hyde_steps.py
    "pytest-xdist>=3.6",  # CI runs the suite in parallel (-n auto)
    "ruff>=0.17",          # CI: ruff check (config in the repo root's ruff.toml)
    "basedpyright>=1.40",  # CI: type check app/ against the baseline (see below)
    "pip-audit>=2.10",     # CI: known vulnerabilities in the lock files
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Type checking for app/: pyright's default ("standard") rules, through basedpyright
# because it can baseline. .basedpyright/baseline.json holds the errors that existed
# when the check was added; CI fails only on new ones. After fixing some, shrink the
# baseline with `basedpyright --writebaseline` (run in services/api) and commit it.
[tool.basedpyright]
include = ["app"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
